# Mutation Testing mit mutmut (intern#209) -- lokales Werkzeug bei Bedarf,
# nicht in der CI und nicht im normalen Testlauf.
#
# Einsatz: Qt-freie Logik-Module, die schon Tests haben (z. B. heads_sides,
# song_match, singing_sections), vor allem bei neuen Modulen oder Umbauten.
# Ein Mutant ist eine absichtlich veraenderte Codezeile; "survived" heisst:
# alle Tests blieben gruen -> fehlender Test oder Aenderung ohne Wirkung.
#
# Einrichten (einmal je venv):
#   pip install mutmut==2.5.1 pytest-timeout==2.4.0
#
# Ablauf:
#   mutmut run                      # Modul und Tests aus diesem Abschnitt
#   mutmut results                  # Liste der Ueberlebenden
#   mutmut show <nr>                # ein Mutant als Diff
#   git checkout -- src/<modul>.py  # siehe CRLF unten
# Anderes Modul ohne Aenderung dieser Datei:
#   mutmut run --paths-to-mutate src/<modul>.py --runner "<runner unten mit anderer Testdatei>"
# Vor einem Modulwechsel .mutmut-cache loeschen.
#
# Windows-Fallen (deshalb sieht der Runner so aus):
# - mutmut 3.x braucht fork() und laeuft nur in WSL, daher 2.5.1.
# - python -B: mutmut schreibt Mutanten schneller, als die pyc-Pruefung
#   (Sekunde + Groesse) es merkt; ohne -B laeuft alter Bytecode und Mutanten
#   "ueberleben" faelschlich.
# - --timeout (pytest-timeout): mutmuts eigenes Zeitlimit beendet unter Windows
#   nur die Shell, ein Endlosschleifen-Mutant liefe als Python-Prozess weiter.
# - Nur Testdateien, die main NICHT importieren: main belegt beim Import die
#   Einzelinstanz-Sperre; haengt ein Prozess, meldet jeder weitere Lauf
#   "Callers Caddy laeuft bereits".
# - mutmut schreibt die Quelldatei mit CRLF zurueck: danach git checkout.
[mutmut]
paths_to_mutate = src/heads_sides.py
tests_dir = tests/lyrics/
runner = python -B -m pytest -x -q --assert=plain -p no:cacheprovider --timeout=20 tests/lyrics/test_heads_sides.py
