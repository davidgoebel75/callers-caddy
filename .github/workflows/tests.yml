name: Tests

on:
  # Jede Basis, auch gestapelte PRs auf einen Feature-Branch.
  pull_request:
  # Nach dem Merge: zwei einzeln gruene PRs koennen zusammen rot sein.
  push:
    branches: [develop]

jobs:
  pytest:
    runs-on: windows-latest
    # Netz fuer alles ausserhalb des Testschritts, etwa ein haengendes
    # pip install. Laengster Lauf bisher: gut 4,5 Minuten.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r installer/requirements.txt
          pip install pytest pyflakes

      - name: pyflakes
        run: python -m pyflakes src tests tools installer

      - name: Run tests
        # Laengster Testschritt bisher: knapp 3 Minuten. Ein haengender Test
        # (intern#178) lief sonst bis zum GitHub-Limit von 6 Stunden.
        # -v: Die letzte Test-ID ohne PASSED ist dann der haengende Test.
        timeout-minutes: 5
        run: pytest -v tests/
        env:
          QT_QPA_PLATFORM: offscreen
