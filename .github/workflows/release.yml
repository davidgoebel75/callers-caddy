name: Release

# Der Release-Knopf: Actions -> Release -> Run workflow.
# Die gewaehlte Branch ist die Quelle (normal develop, im Notfall main).
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Kurztitel fuer den Changelog-Abschnitt"
        required: false
        default: ""
      part:
        description: "Was hochzaehlen: patch = kleine Aenderungen/Fixes, minor = grosse neue Funktionen, major = Umbruch"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Versionsnummer erzwingen, z. B. 2.0.0 (leer = hochzaehlen; schlaegt den Teil oben)"
        required: false
        default: ""
      dry_run:
        description: "Nur pruefen — nichts committen, kein Pull Request"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Versionsnummer setzen
        id: bump
        # Eingaben per env, nicht per ${{ }} in die Shell: sonst kann ein
        # Titel mit Anfuehrungszeichen Befehle einschmuggeln.
        env:
          TITLE: ${{ inputs.title }}
          VERSION: ${{ inputs.version }}
          PART: ${{ inputs.part }}
          CHECK: ${{ inputs.dry_run && '--check' || '' }}
        # Mit erzwungener Nummer zaehlt der Teil nicht (bump_version.py lehnt beides zusammen ab).
        run: |
          if [ -n "$VERSION" ]; then
            python tools/bump_version.py --title "$TITLE" --version "$VERSION" $CHECK
          else
            python tools/bump_version.py --title "$TITLE" --part "$PART" $CHECK
          fi

      - name: Commit und Push
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Kein "commit -am": das naehme eine neu angelegte Archivdatei nicht mit.
          git add CHANGELOG.md docs/changelog src/main.py
          git commit -m "Release $VERSION: Version-Bump + Changelog-Abschnitt"
          git push origin HEAD:${{ github.ref_name }}

      - name: Pull Request nach main anlegen
        if: ${{ !inputs.dry_run && github.ref_name != 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          SOURCE: ${{ github.ref_name }}
        run: |
          gh pr create --base main --head "$SOURCE" \
            --title "Release $VERSION" \
            --body "Version-Bump und Changelog-Abschnitt fuer $VERSION, angelegt vom Release-Workflow.

          Mergen mit **Create a merge commit** — nie Squash (sonst verliert Git die Verbindung develop/main).
          Danach auf main: bauen und Tag \`$VERSION\` setzen." \
          || gh pr list --base main --head "$SOURCE" --json url -q '.[0].url'
