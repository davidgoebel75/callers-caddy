[pytest]
# Stamm ist immer rootdir, auch beim Start aus einem Unterordner (intern#162)
testpaths = tests
pythonpath = src
# Haengt ein Test laenger, schreibt pytest die Stacks aller Threads ins Log
# (intern#178). Muss unter dem Zeitlimit des CI-Testschritts bleiben
# (5 Minuten, davidgoebel75/callers-caddy#99).
faulthandler_timeout = 120
