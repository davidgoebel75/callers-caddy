[pytest]
# Stamm ist immer rootdir, auch beim Start aus einem Unterordner (intern#162)
testpaths = tests
pythonpath = src
# Laeuft ein Test laenger als 120 s, schreibt pytest die Aufrufstapel aller
# Threads ins Log (intern#178). Muss unter dem CI-Limit von 5 Minuten bleiben.
faulthandler_timeout = 120
